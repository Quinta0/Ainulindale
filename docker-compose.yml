services:
  ainulindale:
    image: ghcr.io/quinta0/ainulindale:latest
    container_name: ainulindale
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TZ: ${TZ:-Europe/Zurich}
      PUID: ${PUID:-0}  # 99/100 on Unraid runs slskd + Explo as nobody:users;
      PGID: ${PGID:-0}  # chown the music folders first if you switch

      # --- VPN (gluetun) ------------------------------------------------------
      VPN_SERVICE_PROVIDER: ${VPN_SERVICE_PROVIDER:-protonvpn}
      VPN_TYPE: wireguard
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY}
      WIREGUARD_ADDRESSES: ${WIREGUARD_ADDRESSES}
      SERVER_COUNTRIES: ${VPN_COUNTRY:-Switzerland}
      VPN_PORT_FORWARDING_PROVIDER: protonvpn
      PORT_FORWARDING: ${PORT_FORWARDING:-${VPN_PORT_FORWARDING:-false}}
      FIREWALL_OUTBOUND_SUBNETS: ${FIREWALL_OUTBOUND_SUBNETS:-} # auto from NAVIDROME_URL when it is an IP

      # --- slskd ----------------------------------------------------------------
      SLSKD_SLSK_USERNAME: ${SOULSEEK_USERNAME}
      SLSKD_SLSK_PASSWORD: ${SOULSEEK_PASSWORD}
      SLSKD_USERNAME: ${SLSKD_WEB_USERNAME}
      SLSKD_PASSWORD: ${SLSKD_WEB_PASSWORD}
      SLSKD_API_KEY: ${SLSKD_API_KEY:-} # generated if empty

      # --- schedule -------------------------------------------------------------
      DISCOVERY_SCHEDULE: ${DISCOVERY_SCHEDULE:-15 0 * * *}
      RUN_ON_START: ${RUN_ON_START:-false}
      EXPLO_WEB_UI: ${EXPLO_WEB_UI:-false}
      UI_USERNAME: ${EXPLO_WEB_USERNAME:-} # set both, or the Explo UI is open to your LAN
      UI_PASSWORD: ${EXPLO_WEB_PASSWORD:-}

      # --- sources --------------------------------------------------------------
      DISCOVERY_SERVICE: listenbrainz
      LISTENBRAINZ_DISCOVERY: playlist
      LISTENBRAINZ_USER: ${LISTENBRAINZ_USER}
      LISTENBRAINZ_USER_TOKEN: ${LISTENBRAINZ_USER_TOKEN:-}
      DISCOVERY_MIXES: ${DISCOVERY_MIXES:-weekly} # daily, weekly, monthly; ":N" sets the track count
      DISCOVERY_AVOID_TAGS: ${DISCOVERY_AVOID_TAGS:-}
      DISCOVERY_PREFER_TAGS: ${DISCOVERY_PREFER_TAGS:-}

      # --- retention ------------------------------------------------------------
      KEEP_WEEKS: ${KEEP_WEEKS:-2}
      PRUNE_FILES: ${PRUNE_FILES:-true}
      KEEP_FAVOURITES: ${KEEP_FAVOURITES:-true}
      PRUNE_LEGACY_JAMS: ${PRUNE_LEGACY_JAMS:-false}

      # --- Navidrome ------------------------------------------------------------
      EXPLO_SYSTEM: subsonic
      SYSTEM_URL: ${NAVIDROME_URL}
      SYSTEM_USERNAME: ${NAVIDROME_USERNAME}
      SYSTEM_PASSWORD: ${NAVIDROME_PASSWORD}
      PLAYLISTNAME_FORMAT: week # the pruner recognises playlists by this naming
      USE_SUBDIRECTORY: "true"  # one folder per playlist, which is what gets pruned

      # --- downloading ----------------------------------------------------------
      DOWNLOAD_SERVICES: ${DOWNLOAD_SERVICES:-slskd,youtube}
      SLSKD_MIGRATE_DOWNLOADS: "true"
      REQUIRE_SLSKD: ${REQUIRE_SLSKD:-true}
      EXTENSIONS: ${EXTENSIONS:-flac,wav,mp3}
      MIN_BITRATE: ${MIN_BITRATE:-320}
      MIN_BIT_DEPTH: ${MIN_BIT_DEPTH:-16}
      TRACK_EXTENSION: mp3
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      SLEEP: 2
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      # --- versions (downloaded on start; change + restart to update) -----------
      # SLSKD_VERSION: 0.26.2
      # EXPLO_VERSION: v1.2.0   # discover.py writes Explo's v1.2 cache; re-test before bumping
    volumes:
      - ${CONFIG_PATH:-./config}:/config # gluetun/, slskd/, explo/, bin/
      - ${MUSIC_PATH}:/music             # slskd shares it, downloads to slskd/, Explo files into explo/
    ports:
      - 5030:5030 # slskd web UI
      - 7288:7288 # Ainulindale web UI (status, runs, Soulseek search)
      - 7289:7289 # Explo web UI, only with EXPLO_WEB_UI=true
    restart: unless-stopped
